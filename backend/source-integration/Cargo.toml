[package]
name = "mam-source-integration"
description = "MAM Source Integration — busca e obtenção autorizada de obras e capítulos"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tokio = { version = "1", features = ["rt", "process", "time"] }
async-trait = "0.1"
zip = "0.6"
sha2 = "0.10"
mam-core = { path = "../core" }
mam-database = { path = "../database" }
mam-archive = { path = "../archive" }

[dev-dependencies]
serde_json = "1"
