[package]
name = "mam-database"
description = "MAM Database — persistência local SQLite (schema, migrações, operações CRUD)"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tokio = { version = "1", features = ["rt"] }
mam-core = { path = "../core" }

[dev-dependencies]
serde_json = "1"
