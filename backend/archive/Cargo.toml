[package]
name = "mam-archive"
description = "MAM Archive Manager — geração e leitura de arquivos CBZ"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
flate2 = "1"
thiserror = "1"
walkdir = "2"
mam-core = { path = "../core" }
mam-storage = { path = "../storage" }

[dev-dependencies]
serde_json = "1"
