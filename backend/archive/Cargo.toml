[package]
name = "mam-archive"
description = "MAM Archive Manager — geração e leitura de arquivos CBZ"
version = "0.1.0"
edition = "2024"

[dependencies]
flate2 = "1"
zip = "0.6"
walkdir = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tokio = { version = "1", features = ["rt"] }
mam-core = { path = "../core" }
mam-database = { path = "../database" }
mam-storage = { path = "../storage" }

[dev-dependencies]
serde_json = "1"
