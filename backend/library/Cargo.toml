[package]
name = "mam-library"
description = "MAM Library Manager — catálogo de obras, volumes e capítulos"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
thiserror = "1"
mam-core = { path = "../core" }

[dev-dependencies]
serde_json = "1"
