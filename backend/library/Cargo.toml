[package]
name = "mam-library"
description = "MAM Library Manager — catálogo de obras, volumes e capítulos"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
mam-core = { path = "../core" }
mam-database = { path = "../database" }

[dev-dependencies]
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
