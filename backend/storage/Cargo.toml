[package]
name = "mam-storage"
description = "MAM Storage Manager — bibliotecas, unidades, espaço, duplicatas, integridade SHA-256"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
serde_json = "1"
