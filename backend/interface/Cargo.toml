[package]
name = "mam-interface"
description = "MAM Interface — comandos e eventos Tauri para o frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
tauri = "2"
thiserror = "1"
mam-core = { path = "../core" }
mam-database = { path = "../database" }
mam-chapter = { path = "../chapter" }
mam-archive = { path = "../archive" }
mam-source-integration = { path = "../source-integration" }
mam-library = { path = "../library" }

[dev-dependencies]
serde_json = "1"
