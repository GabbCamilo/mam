[package]
name = "mam-chapter"
description = "MAM Chapter Manager — detecção de capítulos e páginas"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
thiserror = "1"
mam-core = { path = "../core" }

[dev-dependencies]
serde_json = "1"
