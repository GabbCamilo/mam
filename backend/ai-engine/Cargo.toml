[package]
name = "mam-ai-engine"
description = "MAM Manga AI Engine — coordenação com processo Python via JSON-RPC stdio"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
thiserror = "1"
tokio-util = { version = "0.7", features = ["io"] }
mam-core = { path = "../core" }

[dev-dependencies]
serde_json = "1"
